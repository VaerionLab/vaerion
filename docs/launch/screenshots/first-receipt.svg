<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="cap2-title cap2-desc" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">
  <title id="cap2-title">Real terminal capture — vae run demo, receipt folded, journal_verified true (exit 0)</title>
