[project]
name = "vaerion-crewai"
version = "0.1.15rc1"
description = "Official Vaerion integration for CrewAI — MCPServerAdapter bound to the in-engine `vae mcp` verification layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Auren", email = "auren@vaerion.dev" }]
keywords = ["vaerion", "verification", "crewai", "mcp", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Agents",
]
dependencies = [
  "crewai-tools>=1.0",
  # Declared honestly: crewai-tools 1.15.23 IMPORTS mcpadapt (its mcp machinery)
  # but does NOT declare it in its own metadata (measured). Without it,
  # MCPServerAdapter degrades to MCP_AVAILABLE=False and prompts via click.
  "mcpadapt>=0.1.20",
  # PIN (measured 2026-10-03): mcp 2.x removes mcp.shared.context.RequestContext
  # (imported by mcpadapt/crewai-tools machinery). Cap below 2 until upstream
  # ratifies the 2.x surface.
  "mcp>=1,<2",
]

[project.urls]
Repository = "https://github.com/VaerionLab/vaerion"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
