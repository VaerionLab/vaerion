# Vaerion release publication — the production half of the release train.
#
# verify.yml (on a v* tag) re-runs the gates and PACKS the signed artifact set.
# This workflow PUBLISHES it: dispatch it with a v* tag and it re-packs the
# same deterministic artifact set ON the tag (the tarball is byte-reproducible
# — proven in every dist-report), then creates the GitHub Release with the
# artifacts, checksums, signature, and the release notes of record.
#
# Tag law (Phase 64): BOTH tag forms publish — `vX.Y.Z-rcN` release
# candidates (marked --prerelease, notes from docs/RELEASE-NOTES-<tag>.md)
# and `vX.Y.Z` General Availability tags (stable, notes from
# release/<X.Y.Z>/RELEASE-NOTES.md when present, else docs/ first).
#
# Rollback law (docs/operations/DEPLOYMENT.md): tags are immutable; a bad
# release is never rewritten — it is marked, and the previous tag is
# re-dispatched here. This workflow is idempotent per tag (create-or-update).
#
# Least privilege: this is the ONLY workflow that needs contents:write —
# creating releases and uploading assets. verify.yml stays read-only.

name: release-publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'The v* tag of record to publish (v0.1.15-rc1 or v0.1.15)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: publish the signed release
    runs-on: ubuntu-latest
    # GitHub Environment `release` (Phase 64 F-01/TD-14): every dispatch of
    # this publish job requires the environment's required reviewers, so a
    # side-branch dispatch can no longer bypass the in-repo tripwires. The
    # environment (with reviewers) is created founder-side — see
    # release/v0.1.15/FOUNDER-LANDING-RUNBOOK.md step 4b.
    environment: release
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the tag input (no shell injection into the release path)
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-rc[0-9]*) echo "tag ok (release candidate): $TAG" ;;
            v[0-9]*.[0-9]*.[0-9]*)         echo "tag ok (general availability): $TAG" ;;
            *) echo "REFUSING: '$TAG' is not a vMAJOR.MINOR.PATCH[-rcN] tag" >&2; exit 2 ;;
          esac

      - name: Checkout the tag of record (full history — the repository is the evidence)
        # SHA-pinned (immutable reference — the supply-chain law).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Bun (pinned — the verified substrate)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install (frozen lockfile — supply-chain law)
        run: bun install --frozen-lockfile

      - name: Provision the release signing key (secret → untracked key file)
        # The same fail-closed contract as verify.yml's release job: without
        # the secret the packer generates a session-bound bootstrap key AND
        # DISCLOSES it in dist-report.json — a pack report without the
        # disclosure line is the proof the production key signed this release.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            mkdir -p keys
            printf '%s' "$RELEASE_SIGNING_KEY" > keys/release-signing.key
            chmod 600 keys/release-signing.key
          else
            echo "RELEASE_SIGNING_KEY not set — the packager will fail closed to a bootstrap key (disclosed in the report)"
          fi

      - name: Package the release (fail-closed; re-runs all gates internally)
        run: bun run tools/dist-pack.ts

      - name: Assert the production key signed this pack (the tripwire, inverted)
        # Shell-truth law (Phase 8, E2306): the bootstrap disclosure line must
        # be ABSENT — its presence means the secret was unreadable and this
        # release must not be published. Phase 31: dist-pack.ts now writes
        # the disclosure into THIS report (the grep is non-vacuous), and a
        # second fail-closed leg binds the pack to the repository's key of
        # record: the shipped public half must be byte-identical to the
        # tracked keys/release-signing.pub, so a pack signed by any other
        # key (bootstrap, stale key file, or mismatched secret) never publishes.
        run: |
          if grep -q "bootstrap key GENERATED this run" dist/dist-report.json; then
            echo "REFUSING to publish: the pack report discloses a BOOTSTRAP key" >&2
            exit 2
          fi
          if ! cmp -s dist/release-signing.pub keys/release-signing.pub; then
            echo "REFUSING to publish: the signed public key does not match the repository key of record (keys/release-signing.pub) — provision RELEASE_SIGNING_KEY or rotate per docs/security/SIGNING-CEREMONY.md" >&2
            exit 2
          fi
          echo "production key confirmed (no bootstrap disclosure in dist-report.json; signed public key matches the key of record)"

      - name: Artifact parity gate (SOURCE = PACKAGE — the Phase 61.1 one-true-artifact law)
        # Phase 61.0 root cause: a published artifact differed from the tree
        # wearing the same version (13 divergent engine paths). This gate
        # re-builds the npm tarball from the checked-out tag and refuses to
        # publish unless the packed engine's surface, version, completeness
        # anchor, and payload are byte-identical to the tree of record.
        run: bun run tools/verify-artifact-parity.ts

      - name: Publish the GitHub Release (idempotent per tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes of record, in order: the dated docs/ notes file, then the
          # release kit's RELEASE-NOTES.md (release/<X.Y.Z>/ — the GA kit
          # convention), else generated notes.
          NOTES_FILE=""
          if [ -f "docs/RELEASE-NOTES-${TAG}.md" ]; then
            NOTES_FILE="docs/RELEASE-NOTES-${TAG}.md"
          elif [ -f "release/${TAG#v}/RELEASE-NOTES.md" ]; then
            NOTES_FILE="release/${TAG#v}/RELEASE-NOTES.md"
          fi
          EXTRA_ARGS=()
          if [ -n "$NOTES_FILE" ]; then
            echo "release notes of record: $NOTES_FILE"
            EXTRA_ARGS+=(--notes-file "$NOTES_FILE")
          else
            echo "no notes file found — falling back to --generate-notes"
            EXTRA_ARGS+=(--generate-notes)
          fi
          # Honesty on the discovery surface: an -rcN tag is a pre-GA release
          # and is MARKED as one (GitHub's prerelease flag) — a consumer
          # browsing the releases page sees the true maturity at a glance.
          # A GA tag (vX.Y.Z with no -rcN) publishes STABLE: no prerelease flag.
          case "$TAG" in
            *-rc[0-9]*) echo "prerelease marking: yes (release candidate)"; EXTRA_ARGS+=(--prerelease) ;;
            *)          echo "prerelease marking: none (General Availability)" ;;
          esac
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "release $TAG exists — updating assets and body (idempotent re-publish)"
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" "${EXTRA_ARGS[@]}"
          else
            gh release create "$TAG" dist/* --title "Vaerion ${TAG}" "${EXTRA_ARGS[@]}"
          fi
          gh release view "$TAG" --json name,tagName,url,isPrerelease,assets

      - name: Record the publication (the measured close)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Publication record"
            echo ""
            echo "- tag: \`$TAG\`"
            echo "- release URL: $(gh release view "$TAG" --json url -q .url)"
            echo "- assets: $(gh release view "$TAG" --json assets -q 'length(.assets)')"
            echo "- pack report: production key (no bootstrap disclosure)"
          } >> "$GITHUB_STEP_SUMMARY"
