<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #0b0b0d 0%, #141416 55%, #1a1710 100%);
    color: #f2f0e9;
    position: relative;
  }
  .frame {
    position: absolute; inset: 26px;
    border: 1px solid rgba(212,175,55,0.35);
  }
  .corner { position: absolute; width: 18px; height: 18px; border-color: #d4af37; border-style: solid; }
  .c-tl { top: 26px; left: 26px; border-width: 3px 0 0 3px; }
  .c-tr { top: 26px; right: 26px; border-width: 3px 3px 0 0; }
  .c-bl { bottom: 26px; left: 26px; border-width: 0 0 3px 3px; }
  .c-br { bottom: 26px; right: 26px; border-width: 0 3px 3px 0; }
  .wrap { position: absolute; inset: 0; padding: 84px 96px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand img { width: 108px; height: 108px; }
  .wordmark { font-size: 92px; font-weight: 800; letter-spacing: 14px; line-height: 1; color: #f2f0e9; }
  .tagline { margin-top: 14px; font-size: 34px; font-weight: 500; color: #d4af37; letter-spacing: 1px; }
  .mech { margin-top: 40px; display: flex; gap: 26px; align-items: center; }
  .mech .pill {
    border: 1px solid rgba(212,175,55,0.5); color: #e8e4d8;
    padding: 14px 30px; font-size: 25px; letter-spacing: 0.5px; border-radius: 999px;
    background: rgba(212,175,55,0.07);
  }
  .sep { color: #d4af37; font-size: 26px; }
  .footer { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; color: #9c9ca6; font-size: 23px; letter-spacing: 1px; }
  .footer .mark { color: #d4af37; font-size: 40px; font-weight: 700; letter-spacing: 0; }
  .vline { position: absolute; top: 26px; bottom: 26px; left: 640px; width: 1px; background: linear-gradient(180deg, transparent, rgba(212,175,55,0.18), transparent); }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="corner c-tl"></div><div class="corner c-tr"></div>
  <div class="corner c-bl"></div><div class="corner c-br"></div>
  <div class="vline"></div>
  <div class="wrap">
    <div>
      <div class="brand">
        <img src="../../public/icon-192.png" alt="">
        <div>
          <div class="wordmark">VAERION</div>
          <div class="tagline">Verification Layer for AI Agents</div>
        </div>
      </div>
      <div class="mech">
        <span class="pill">Signed receipts</span><span class="sep">·</span>
        <span class="pill">Fail-closed policies</span><span class="sep">·</span>
        <span class="pill">Deterministic proof</span>
      </div>
    </div>
    <div class="footer">
      <span>github.com/VaerionLab/vaerion</span>
      <span class="mark">»</span>
      <span>v0.1.15&nbsp;&nbsp;·&nbsp;&nbsp;Apache-2.0&nbsp;&nbsp;·&nbsp;&nbsp;Zero telemetry</span>
    </div>
  </div>
</body>
</html>
